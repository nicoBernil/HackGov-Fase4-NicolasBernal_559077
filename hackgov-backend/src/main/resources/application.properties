# ============================================================================
#  Configuracoes da aplicacao HackGov
# ============================================================================

spring.application.name=hackgov-backend

# ----------------------------------------------------------------------------
#  CONEXAO COM O BANCO ORACLE  <<< VOCE PRECISA AJUSTAR ESTAS 3 LINHAS >>>
# ----------------------------------------------------------------------------
# A "url" diz onde o banco esta. Escolha UMA das opcoes abaixo:
#
#   (A) Oracle da FIAP (mais comum em projetos da faculdade):
#       jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL
#       usuario = seu RM    /    senha = sua data de nascimento (padrao FIAP)
#
#   (B) Oracle XE instalado na sua maquina (Docker ou instalador):
#       jdbc:oracle:thin:@//localhost:1521/XEPDB1
#
# Troque os valores abaixo pelos seus:
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=System
spring.datasource.password=3505
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ----------------------------------------------------------------------------
#  JPA / Hibernate (a ponte entre os objetos Java e as tabelas)
# ----------------------------------------------------------------------------
# "none" = o Hibernate NAO mexe nas tabelas. Quem cria o banco e voce, rodando
# o schema.sql. Isso e proposital: faz parte de voce aprender o banco. :)
spring.jpa.hibernate.ddl-auto=none

# Mostra no console os comandos SQL que o Hibernate executa (otimo p/ aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------------
#  Servidor web
# ----------------------------------------------------------------------------
# A API vai responder em http://localhost:8080
server.port=8080
